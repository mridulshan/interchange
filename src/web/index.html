<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interchange</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23E4E8E4'/%3E%3Cpath d='M16 2v28' stroke='%230F6E8C' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23F8F9F7' stroke='%23D64227' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="wrap">

  <header class="sheet">
    <div class="sheet-inner">
      <h1>Interchange<span class="mark"></span></h1>
      <div class="sheet-meta">
        <p id="subtitle">A map of what you shipped across every repo, in what order, and what each thing holds up.</p>
        <div class="sheet-stamp" id="stamp">loading…</div>
      </div>
    </div>
  </header>

  <div class="map">
    <div class="map-bar">
      <div class="lines" id="lines"></div>
      <div class="bar-actions">
        <button class="ghost" id="add">Draw a feature</button>
        <button class="scan" id="scan">Check against repos</button>
      </div>
    </div>

    <div class="banner issues" id="issues" hidden></div>
    <div class="banner" id="banner" hidden>
      <h3 id="banner-h"></h3>
      <div id="findings"></div>
    </div>

    <div class="rows" id="rows"></div>
    <div class="map-foot" id="foot">Ship order runs top to bottom. A feature sits on every line it touched.</div>
  </div>

  <p class="hint">Tap a feature to open it. Tap a coloured line to follow one repo.</p>

</div>

<div class="sheet-shade" id="shade" hidden></div>
<aside class="editor" id="editor" hidden aria-label="Feature editor"></aside>
<div class="toast" id="toast" hidden></div>

<script src="./app.js"></script>
</body>
</html>
